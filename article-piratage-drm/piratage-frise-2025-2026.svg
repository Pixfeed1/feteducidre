<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1600px" height="780px" viewBox="0 0 1600 780" version="1.1">
  <title>LA COURSE CONTINUE SANS SA CHAMPIONNE</title>
  <desc>de la retraite d’EMPRESS aux contournements de 2026</desc>
  <g inkscape:groupmode="layer" inkscape:label="Fond" id="couche1">
    <rect x="0" y="0" width="1600" height="780" rx="0" fill="#faf9f6"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Titre" id="couche2">
    <text x="56" y="68" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1a1b20" letter-spacing="2.2" xml:space="preserve">LA COURSE CONTINUE SANS SA CHAMPIONNE</text>
    <text x="56" y="95" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#8c8d96" xml:space="preserve">de la retraite d’EMPRESS aux contournements de 2026</text>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Cartes" id="couche3">
    <rect x="105.016" y="150" width="336" height="136" rx="10" fill="#f4f3ee"/>
    <rect x="105.016" y="150" width="4" height="136" rx="2" fill="#622cc8"/>
    <text x="123.016" y="177" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#622cc8" letter-spacing="1" xml:space="preserve">nov. 2025</text>
    <text x="123.016" y="202" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1a1b20" xml:space="preserve">EMPRESS annonce son retrait</text>
    <text x="123.016" y="224" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">« End of an Era ». Elle invoque des</text>
    <text x="123.016" y="242" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">problèmes de santé et une lassitude</text>
    <text x="123.016" y="260" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">vis-à-vis du milieu.</text>
    <line x1="105.016" y1="286" x2="105.016" y2="496" stroke="#d5d3cc" stroke-width="2"/>
    <rect x="521.656" y="306" width="336" height="136" rx="10" fill="#f4f3ee"/>
    <rect x="521.656" y="306" width="4" height="136" rx="2" fill="#622cc8"/>
    <text x="539.656" y="333" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#622cc8" letter-spacing="1" xml:space="preserve">14 mars 2026</text>
    <text x="539.656" y="358" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1a1b20" xml:space="preserve">Doom: The Dark Ages craqué</text>
    <text x="539.656" y="380" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">Par un dénommé voices38, et sans</text>
    <text x="539.656" y="398" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">hyperviseur.</text>
    <line x1="521.656" y1="442" x2="521.656" y2="496" stroke="#d5d3cc" stroke-width="2"/>
    <rect x="738.729" y="150" width="336" height="136" rx="10" fill="#f4f3ee"/>
    <rect x="738.729" y="150" width="4" height="136" rx="2" fill="#622cc8"/>
    <text x="756.729" y="177" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#622cc8" letter-spacing="1" xml:space="preserve">mai 2026</text>
    <text x="756.729" y="202" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1a1b20" xml:space="preserve">Lego Batman craqué le jour de sa</text>
    <text x="756.729" y="222" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1a1b20" xml:space="preserve">sortie</text>
    <text x="756.729" y="244" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">Sans hyperviseur non plus. Premier Denuvo</text>
    <text x="756.729" y="262" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">tombé le jour J en 2026.</text>
    <line x1="738.729" y1="286" x2="738.729" y2="496" stroke="#d5d3cc" stroke-width="2"/>
    <rect x="952.301" y="306" width="336" height="136" rx="10" fill="#f4f3ee"/>
    <rect x="952.301" y="306" width="4" height="136" rx="2" fill="#622cc8"/>
    <text x="970.301" y="333" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#622cc8" letter-spacing="1" xml:space="preserve">juil. 2026</text>
    <text x="970.301" y="358" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1a1b20" xml:space="preserve">id Software retire Denuvo de Doom</text>
    <text x="970.301" y="380" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">À l’occasion d’une grosse mise à jour. Le</text>
    <text x="970.301" y="398" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">studio n’a pas expliqué pourquoi.</text>
    <line x1="952.301" y1="442" x2="952.301" y2="496" stroke="#d5d3cc" stroke-width="2"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Axe" id="couche4">
    <line x1="56" y1="496" x2="1544" y2="496" stroke="#1a1b20" stroke-width="2"/>
    <line x1="56" y1="496" x2="56" y2="502" stroke="#d5d3cc" stroke-width="1"/>
    <line x1="161.035" y1="496" x2="161.035" y2="502" stroke="#d5d3cc" stroke-width="1"/>
    <line x1="269.572" y1="496" x2="269.572" y2="508" stroke="#1a1b20" stroke-width="2"/>
    <text x="275.572" y="522" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#8c8d96" xml:space="preserve">janv. 2026</text>
    <line x1="378.108" y1="496" x2="378.108" y2="502" stroke="#d5d3cc" stroke-width="1"/>
    <line x1="476.141" y1="496" x2="476.141" y2="502" stroke="#d5d3cc" stroke-width="1"/>
    <line x1="584.678" y1="496" x2="584.678" y2="502" stroke="#d5d3cc" stroke-width="1"/>
    <line x1="689.713" y1="496" x2="689.713" y2="502" stroke="#d5d3cc" stroke-width="1"/>
    <line x1="798.249" y1="496" x2="798.249" y2="502" stroke="#d5d3cc" stroke-width="1"/>
    <line x1="903.285" y1="496" x2="903.285" y2="502" stroke="#d5d3cc" stroke-width="1"/>
    <text x="909.285" y="522" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#8c8d96" xml:space="preserve">juil. 2026</text>
    <line x1="1011.82" y1="496" x2="1011.82" y2="502" stroke="#d5d3cc" stroke-width="1"/>
    <line x1="1120.36" y1="496" x2="1120.36" y2="502" stroke="#d5d3cc" stroke-width="1"/>
    <line x1="1225.39" y1="496" x2="1225.39" y2="502" stroke="#d5d3cc" stroke-width="1"/>
    <line x1="1333.93" y1="496" x2="1333.93" y2="502" stroke="#d5d3cc" stroke-width="1"/>
    <line x1="1438.96" y1="496" x2="1438.96" y2="502" stroke="#d5d3cc" stroke-width="1"/>
    <rect x="56" y="489" width="105.035" height="14" rx="6" fill="#a278e4"/>
    <circle cx="521.656" cy="496" r="8" fill="#622cc8"/>
    <rect x="689.713" y="489" width="108.536" height="14" rx="6" fill="#a278e4"/>
    <rect x="903.285" y="489" width="108.536" height="14" rx="6" fill="#a278e4"/>
    <line x1="105.016" y1="470" x2="738.729" y2="470" stroke="#622cc8" stroke-width="2"/>
    <line x1="105.016" y1="464" x2="105.016" y2="476" stroke="#622cc8" stroke-width="2"/>
    <line x1="738.729" y1="464" x2="738.729" y2="476" stroke="#622cc8" stroke-width="2"/>
    <text x="393.857" y="459" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#622cc8" letter-spacing="1" xml:space="preserve">six mois</text>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Bande" id="couche5">
    <rect x="269.572" y="558" width="1274.43" height="52" rx="10" fill="#e9e0fc"/>
    <text x="287.572" y="582" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#622cc8" xml:space="preserve">Contournements par hyperviseur, sous le noyau Windows</text>
    <text x="287.572" y="602" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#646670" xml:space="preserve">courant 2026, aucune date précisée par les sources</text>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Pied" id="couche6">
    <line x1="56" y1="650" x2="1544" y2="650" stroke="#d5d3cc" stroke-width="2"/>
    <text x="56" y="683" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#8c8d96" xml:space="preserve">Dates de l’article. Un seul événement a un jour connu, le 14 mars 2026 : point plein. Les trois autres ne sont datés qu’au mois, marqués par une barre sur tout le mois.</text>
    <text x="56" y="707" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#8c8d96" xml:space="preserve">Les contournements par hyperviseur n’ont pas de date dans les sources, seulement l’année : ils forment une bande et non un point, faute de quoi la figure inventerait une précision.</text>
    <text x="56" y="731" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#8c8d96" xml:space="preserve">L’intervalle de six mois est calculé à partir des deux dates. Le corps de l’article écrit « six mois plus tard, en mai 2026 » ; la légende annonce neuf, ce qui placerait le retrait en août 2025.</text>
  </g>
</svg>
