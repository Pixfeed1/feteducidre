<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1600px" height="544px" viewBox="0 0 1600 544" version="1.1">
  <title>CINQ ANS APRÈS SA MORT, LE COMPTEUR TOURNE ENCORE</title>
  <desc>vues cumulées des vidéos de DJ Arafat d’après sa fondation, et les deux autres chiffres que cite l’article</desc>
  <g inkscape:groupmode="layer" inkscape:label="fond" id="couche1">
    <rect x="0" y="0" width="1600" height="544" rx="0" fill="#faf9f6"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="titre" id="couche2">
    <text x="56" y="64" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1a1b20" letter-spacing="2.2" xml:space="preserve">CINQ ANS APRÈS SA MORT, LE COMPTEUR TOURNE ENCORE</text>
    <text x="56" y="90" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#8c8d96" xml:space="preserve">vues cumulées des vidéos de DJ Arafat d’après sa fondation, et les deux autres chiffres que cite l’article</text>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="barre" id="couche3">
    <rect x="96" y="252" width="880.75" height="46" rx="8" fill="#ddd3f6"/>
    <rect x="976.75" y="252" width="152.438" height="46" rx="8" fill="#622cc8"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="bornes" id="couche4">
    <line x1="976.75" y1="238" x2="976.75" y2="252" stroke="#646670" stroke-width="2"/>
    <text x="928.091" y="226" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#646670" xml:space="preserve">260 millions</text>
    <text x="941.714" y="323" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#8c8d96" xml:space="preserve">début 2023</text>
    <line x1="1129.19" y1="238" x2="1129.19" y2="252" stroke="#622cc8" stroke-width="2"/>
    <text x="1080.53" y="226" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#622cc8" xml:space="preserve">305 millions</text>
    <text x="1101.94" y="323" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#8c8d96" xml:space="preserve">été 2024</text>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="gain" id="couche5">
    <text x="992.659" y="282" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" xml:space="preserve">+ 45 millions</text>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="cadence" id="couche6">
    <line x1="1218" y1="222" x2="1218" y2="344" stroke="#d5d3cc" stroke-width="2"/>
    <text x="1246" y="262" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="46" font-weight="bold" fill="#622cc8" xml:space="preserve">78 000</text>
    <text x="1246" y="299" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#646670" xml:space="preserve">vues par jour, en moyenne</text>
    <text x="1246" y="323" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#646670" xml:space="preserve">sur ces 19 mois, soit + 17 %</text>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="repères" id="couche7">
    <line x1="56" y1="390" x2="1544" y2="390" stroke="#d5d3cc" stroke-width="2"/>
    <text x="56" y="448" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1a1b20" xml:space="preserve">1 million</text>
    <text x="56" y="474" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">d’abonnés sur sa chaîne YouTube</text>
    <text x="56" y="494" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#8c8d96" xml:space="preserve">janvier 2023</text>
    <text x="800" y="448" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1a1b20" xml:space="preserve">250 000</text>
    <text x="800" y="474" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">auditeurs chaque mois sur Spotify</text>
    <text x="800" y="494" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#8c8d96" xml:space="preserve">chiffre sans date dans l’article</text>
  </g>
</svg>
