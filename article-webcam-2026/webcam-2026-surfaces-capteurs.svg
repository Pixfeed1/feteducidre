  <g inkscape:groupmode="layer" inkscape:label="textes" id="couche6">
    <text x="944" y="197" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1a1b20" xml:space="preserve">APS-C</text>
    <text x="1522" y="196" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#b45309" text-anchor="end" xml:space="preserve">332,3 mm²</text>
    <text x="944" y="224" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">Canon EOS R50 V</text>
    <text x="944" y="253" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#8c8d96" xml:space="preserve">22,3 × 14,9 mm  ·  diagonale 26,8 mm</text>
    <text x="944" y="277" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#8c8d96" xml:space="preserve">559,99 €  ·  × 13,4 la surface du 1/2,5 pouce</text>
    <text x="944" y="359" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1a1b20" xml:space="preserve">1/1,28 pouce</text>
    <text x="1522" y="358" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#622cc8" text-anchor="end" xml:space="preserve">71,5 mm²</text>
    <text x="944" y="386" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">OBSBOT Tiny 3</text>
    <text x="944" y="415" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#8c8d96" xml:space="preserve">9,8 × 7,3 mm  ·  diagonale 12,2 mm</text>
    <text x="944" y="439" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#8c8d96" xml:space="preserve">379,20 €  ·  × 2,9 la surface du 1/2,5 pouce</text>
    <text x="944" y="521" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1a1b20" xml:space="preserve">1/2 pouce</text>
    <text x="1522" y="520" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#7c52d6" text-anchor="end" xml:space="preserve">30,7 mm²</text>
    <text x="944" y="548" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">Insta360 Link 2C</text>
    <text x="944" y="577" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#8c8d96" xml:space="preserve">6,4 × 4,8 mm  ·  diagonale 8 mm</text>
    <text x="944" y="601" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#8c8d96" xml:space="preserve">226,74 €  ·  × 1,2 la surface du 1/2,5 pouce</text>
    <text x="944" y="683" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1a1b20" xml:space="preserve">1/2,5 pouce</text>
    <text x="1522" y="682" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#9678e2" text-anchor="end" xml:space="preserve">24,7 mm²</text>
    <text x="944" y="710" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">Elgato Facecam MK.2</text>
    <text x="944" y="739" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#8c8d96" xml:space="preserve">5,76 × 4,29 mm  ·  diagonale 7,2 mm</text>
    <text x="944" y="763" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#8c8d96" xml:space="preserve">119,99 €  ·  référence des rapports ci-dessous</text>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="pied" id="couche7">
    <line x1="56" y1="840" x2="1544" y2="840" stroke="#d5d3cc" stroke-width="2"/>
    <text x="56" y="877" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#8c8d96" xml:space="preserve">À l’échelle : l’APS-C couvre 13,4 fois la surface du 1/2,5 pouce et 4,6 fois celle du 1/1,28 pouce. Sur le côté, ces écarts tombent à 3,7 et 2,2, ce qui explique qu’ils paraissent moins spectaculaires sur une fiche</text>
    <text x="56" y="901" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#8c8d96" xml:space="preserve">technique.</text>
    <text x="56" y="931" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#8c8d96" xml:space="preserve">Du Facecam MK.2 au Canon EOS R50 V, le prix est multiplié par 4,7 et la surface de capteur par 13,4. Du Tiny 3 au R50 V, 48 % de prix en plus pour 4,6 fois la surface.</text>
    <text x="56" y="961" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#8c8d96" xml:space="preserve">Le « pouce » des capteurs vient du diamètre des anciens tubes vidéo : la diagonale utile vaut environ 16 mm divisés par le dénominateur, jamais 25,4. Les cotes ci-dessus sont les cotes réelles.</text>
  </g>
</svg>
