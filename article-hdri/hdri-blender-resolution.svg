    <text x="57" y="187" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#646670" xml:space="preserve">éclairement à Strength 1, W/m²</text>
    <text x="57" y="208" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#622cc8" xml:space="preserve">identique d’un bout à l’autre</text>
