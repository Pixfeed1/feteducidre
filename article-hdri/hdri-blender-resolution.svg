  <title>LA 8K ÉCLAIRE PAREIL, ET TRIPLE LA MÉMOIRE</title>
  <desc>même scène et même HDRI en quatre résolutions, de la 1K à la 8K ; chaque panneau a son échelle</desc>
  <g inkscape:groupmode="layer" inkscape:label="fond" id="couche1">
