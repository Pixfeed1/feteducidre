  <g inkscape:groupmode="layer" inkscape:label="colonnes" id="couche5">
    <text x="314.667" y="434" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" text-anchor="middle" xml:space="preserve">Tous les MacBook, le Zenbook 14 OLED, les Yoga Slim 7 et le</text>
    <text x="314.667" y="457" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" text-anchor="middle" xml:space="preserve">Dell XPS 14</text>
    <text x="314.667" y="495" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#b02e26" text-anchor="middle" xml:space="preserve">La quantité choisie à la commande est définitive.</text>
    <text x="800" y="434" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" text-anchor="middle" xml:space="preserve">Acer Aspire Go 15, Acer Nitro V 17 AI, et la version AMD du</text>
    <text x="800" y="457" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" text-anchor="middle" xml:space="preserve">Framework Laptop 13 Pro</text>
    <text x="800" y="495" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0c7c5c" text-anchor="middle" xml:space="preserve">Deux barrettes du commerce, à changer pour monter</text>
    <text x="800" y="518" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0c7c5c" text-anchor="middle" xml:space="preserve">jusqu’à 32 Go.</text>
    <text x="1285.33" y="434" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" text-anchor="middle" xml:space="preserve">La version Intel du Framework Laptop 13 Pro</text>
    <text x="1285.33" y="495" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0c7c5c" text-anchor="middle" xml:space="preserve">Un module qui se dévisse. Rapide, amovible, mais</text>
    <text x="1285.33" y="518" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0c7c5c" text-anchor="middle" xml:space="preserve">encore cher.</text>
