    <line x1="738" y1="735" x2="738" y2="685" stroke="#622cc8" stroke-width="2" stroke-linecap="round"/>
    <line x1="738" y1="685" x2="748" y2="685" stroke="#622cc8" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="points" id="couche8">
    <circle cx="618" cy="268" r="4" fill="#622cc8"/>
    <circle cx="413.04" cy="413" r="4" fill="#622cc8"/>
    <circle cx="618" cy="468" r="4" fill="#622cc8"/>
    <circle cx="618" cy="735" r="4" fill="#622cc8"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="annotations" id="couche9">
    <text x="760" y="213" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1a1b20" xml:space="preserve">Le filtre par date</text>
    <text x="760" y="238" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">Aujourd’hui, les 7 ou 30 derniers jours, tout l’historique, ou une période au choix. On peut aussi filtrer par appareil et</text>
    <text x="760" y="260" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">par profil.</text>
    <text x="760" y="373" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1a1b20" xml:space="preserve">Le contenu de la demande</text>
    <text x="760" y="398" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">Amazon garde la transcription et l’enregistrement audio tant que vous ne les supprimez pas, ou jusqu’à l’échéance de</text>
    <text x="760" y="420" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">suppression automatique que vous avez réglée.</text>
    <text x="760" y="533" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1a1b20" xml:space="preserve">Réécouter, puis supprimer</text>
    <text x="760" y="558" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">Chaque demande s’ouvre sur ses deux commandes. La suppression porte sur cette demande seule.</text>
    <text x="760" y="693" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1a1b20" xml:space="preserve">Tout effacer d’un coup</text>
    <text x="760" y="718" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">Le bouton du bas ne vide pas l’historique entier : il efface la période actuellement affichée.</text>
  </g>
