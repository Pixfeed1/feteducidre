  </g>
  <g inkscape:groupmode="layer" inkscape:label="écran" id="couche6">
    <text x="122" y="194" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#8c8d96" xml:space="preserve">Plus  &gt;  Paramètres  &gt;  Confidentialité Alexa</text>
    <text x="122" y="228" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#1a1b20" xml:space="preserve">Historique vocal</text>
    <text x="136" y="273" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#622cc8" xml:space="preserve">Affichage : 7 derniers jours</text>
    <text x="122" y="323" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1a1b20" xml:space="preserve">08:12</text>
    <text x="176" y="323" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#8c8d96" xml:space="preserve">Echo Dot du salon</text>
    <text x="122" y="394" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1a1b20" xml:space="preserve">08:41</text>
    <text x="176" y="394" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#8c8d96" xml:space="preserve">Echo Show de la cuisine</text>
    <text x="146" y="447" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#622cc8" xml:space="preserve">Réécouter l’enregistrement</text>
    <text x="146" y="473" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#b02e26" xml:space="preserve">Supprimer l’enregistrement</text>
    <text x="122" y="521" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1a1b20" xml:space="preserve">12:05</text>
    <text x="176" y="521" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#8c8d96" xml:space="preserve">Echo Dot du salon</text>
    <text x="122" y="592" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1a1b20" xml:space="preserve">19:33</text>
    <text x="176" y="592" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#8c8d96" xml:space="preserve">Echo Dot de la chambre</text>
    <text x="122" y="663" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1a1b20" xml:space="preserve">21:58</text>
    <text x="176" y="663" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#8c8d96" xml:space="preserve">Echo Show de la cuisine</text>
    <text x="366" y="740" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#b02e26" text-anchor="middle" xml:space="preserve">Supprimer toutes mes activités de cette période</text>
  </g>
