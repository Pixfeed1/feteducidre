  <g inkscape:groupmode="layer" inkscape:label="rangées" id="couche9">
    <text x="56" y="754" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#646670" xml:space="preserve">La retouche ne casse qu’un lien, celui du bloc n au suivant : le bloc n + 1 a déjà inscrit l’ancienne empreinte. Les blocs d’après restent cohérents entre eux, et c’est la RÉPARATION qui les condamne : refaire le n + 1 change son empreinte, donc casse le n +</text>
    <text x="56" y="774" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#646670" xml:space="preserve">2, et ainsi de suite jusqu’au bout de la chaîne.</text>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="pied" id="couche10">
    <line x1="56" y1="808" x2="1544" y2="808" stroke="#d5d3cc" stroke-width="2"/>
    <text x="56" y="845" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#8c8d96" xml:space="preserve">Les empreintes ne sont pas décoratives : chacune est un SHA-256 calculé sur le contenu du bloc et l’empreinte du précédent, comme le fait Bitcoin. Changer une transaction change réellement la valeur</text>
    <text x="56" y="869" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#8c8d96" xml:space="preserve">affichée.</text>
    <text x="56" y="899" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#8c8d96" xml:space="preserve">Elles sont tronquées à dix caractères pour tenir dans la figure ; une empreinte SHA-256 en compte soixante-quatre.</text>
    <text x="56" y="929" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#8c8d96" xml:space="preserve">Et il ne suffirait pas de refaire ces trois blocs : il faudrait le faire sur la majorité des copies du registre en même temps, ce qui est le vrai coût d’une falsification.</text>
  </g>
</svg>
