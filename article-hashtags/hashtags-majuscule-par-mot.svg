    <line x1="957.932" y1="444" x2="957.932" y2="470" stroke="#0c7c5c" stroke-width="2"/>
    <text x="963.932" y="467" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1a1b20" xml:space="preserve">Ete</text>
    <line x1="998.057" y1="444" x2="998.057" y2="470" stroke="#0c7c5c" stroke-width="2"/>
    <text x="1004.06" y="467" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1a1b20" xml:space="preserve">2026</text>
    <text x="846" y="496" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#0c7c5c" xml:space="preserve">3 morceaux : une frontière à chaque majuscule interne</text>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="pied" id="couche7">
    <line x1="56" y1="554" x2="1544" y2="554" stroke="#d5d3cc" stroke-width="2"/>
    <text x="56" y="591" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#8c8d96" xml:space="preserve">Un hashtag est une seule chaîne de caractères : les majuscules internes sont la seule frontière de mot qu’un programme puisse y trouver. Les traits ci-dessus ne sont pas dessinés, ils sont calculés depuis la</text>
    <text x="56" y="615" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#8c8d96" xml:space="preserve">chaîne.</text>
    <text x="56" y="645" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#8c8d96" xml:space="preserve">Les recommandations d’accessibilité d’Orange demandent une majuscule au début de chaque mot, et de placer les hashtags à la fin de la publication pour ne pas hacher la lecture du message.</text>
    <text x="56" y="675" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#8c8d96" xml:space="preserve">Cette figure ne simule aucun lecteur d’écran en particulier : VoiceOver, NVDA et JAWS n’ont ni les mêmes heuristiques ni les mêmes réglages. Ce qui vaut pour tous, c’est qu’une chaîne sans majuscule interne</text>
    <text x="56" y="699" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#8c8d96" xml:space="preserve">ne leur offre rien à découper.</text>
  </g>
</svg>
