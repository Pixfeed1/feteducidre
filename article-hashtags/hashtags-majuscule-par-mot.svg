    <text x="56" y="90" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#8c8d96" xml:space="preserve">la seule consigne de hashtag qu’aucune décision de plateforme ne rendra caduque : celle qui rend la légende lisible à voix haute</text>
