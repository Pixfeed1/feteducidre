    <text x="1001.67" y="320" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#1a1b20" xml:space="preserve">naturelles,</text>
    <text x="1079.96" y="320" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#1a1b20" xml:space="preserve">venez</text>
