    <text x="78" y="496" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#b45309" xml:space="preserve">2 morceaux : aucune frontière de mot, sauf devant le chiffre</text>
  </g>
