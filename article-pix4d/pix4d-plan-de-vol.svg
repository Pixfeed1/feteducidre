    <text x="1104" y="437" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">photo.</text>
    <text x="1104" y="517" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="40" font-weight="bold" fill="#1a1b20" xml:space="preserve">8 à 12</text>
    <text x="1104" y="550" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">photos voient chaque point du sol : 4 sur une même ligne, et 2 ou</text>
    <text x="1104" y="573" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">3 lignes.</text>
