  <g inkscape:groupmode="layer" inkscape:label="axe" id="couche7">
    <text x="513.295" y="763" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#646670" text-anchor="middle" xml:space="preserve">T2 2024</text>
