    <text x="56" y="90" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#8c8d96" xml:space="preserve">demandes judiciaires françaises satisfaites par Telegram en 2024, par trimestre, d’après ses propres rapports de transparence</text>
