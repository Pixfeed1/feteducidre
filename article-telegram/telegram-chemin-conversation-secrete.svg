  <g inkscape:groupmode="layer" inkscape:label="légendes" id="couche5">
    <text x="56" y="548" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">Onglet Discussions, toucher l’icône de nouveau</text>
    <text x="56" y="570" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">message, en haut à droite.</text>
    <text x="437.5" y="548" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">Dans la liste qui s’ouvre, choisir Nouvelle</text>
    <text x="437.5" y="570" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">conversation secrète.</text>
    <text x="819" y="548" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">Choisir le correspondant. Un seul : la fonction ne</text>
    <text x="819" y="570" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">connaît pas les groupes.</text>
    <text x="1200.5" y="548" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">La conversation s’ouvre, marquée d’un cadenas.</text>
    <text x="1200.5" y="570" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">Elle exige que vous soyez connectés tous les</text>
    <text x="1200.5" y="592" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">deux.</text>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="bandeau" id="couche6">
    <rect x="56" y="622" width="1488" height="58" rx="10" fill="#faf0e4"/>
    <rect x="56" y="622" width="1488" height="58" rx="10" fill="none" stroke="#b45309" stroke-width="2"/>
    <text x="800" y="657" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#b45309" text-anchor="middle" xml:space="preserve">Ce chemin ne mène jamais à un groupe ni à un canal, et aucun réglage ne permet de l’y ajouter.</text>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="pied" id="couche7">
    <line x1="56" y1="714" x2="1544" y2="714" stroke="#d5d3cc" stroke-width="2"/>
    <text x="56" y="751" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#8c8d96" xml:space="preserve">Redessin stylisé, pas une capture d’écran. La typographie et la palette sont celles des figures de l’article ; seuls les libellés que vous devrez reconnaître sont ceux de l’application.</text>
    <text x="56" y="781" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#8c8d96" xml:space="preserve">Quatre manipulations, et elles n’ouvrent jamais qu’un tête-à-tête. Le chiffrement de bout en bout n’existe ni pour les groupes ni pour les canaux, et cela ne se règle pas : cela se conçoit.</text>
    <text x="56" y="811" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#8c8d96" xml:space="preserve">La conversation secrète exige en outre que les deux correspondants soient connectés au même moment. Une conversation ordinaire, elle, passe par les serveurs de l’entreprise dans un format qu’elle peut lire.</text>
  </g>
</svg>
