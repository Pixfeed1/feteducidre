<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1600px" height="602px" viewBox="0 0 1600 602" version="1.1">
  <title>PRÉVOIR, PROVOQUER, RÉCOLTER</title>
  <desc>le moment où l’image se décide, et les neuf cinéastes de l’article placés d’après leurs déclarations ou celles de leurs collaborateurs</desc>
  <g inkscape:groupmode="layer" inkscape:label="fond" id="couche1">
    <rect x="0" y="0" width="1600" height="602" rx="0" fill="#faf9f6"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="titre" id="couche2">
    <text x="56" y="64" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1a1b20" letter-spacing="2.2" xml:space="preserve">PRÉVOIR, PROVOQUER, RÉCOLTER</text>
    <text x="56" y="90" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#8c8d96" xml:space="preserve">le moment où l’image se décide, et les neuf cinéastes de l’article placés d’après leurs déclarations ou celles de leurs collaborateurs</text>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="axe" id="couche3">
    <line x1="90" y1="214" x2="553.333" y2="214" stroke="#b09ce8" stroke-width="5" stroke-linecap="round"/>
    <line x1="90" y1="205" x2="90" y2="223" stroke="#b09ce8" stroke-width="3" stroke-linecap="round"/>
    <line x1="563.333" y1="214" x2="1026.67" y2="214" stroke="#8c62e0" stroke-width="5" stroke-linecap="round"/>
    <line x1="563.333" y1="205" x2="563.333" y2="223" stroke="#8c62e0" stroke-width="3" stroke-linecap="round"/>
    <line x1="1036.67" y1="214" x2="1500" y2="214" stroke="#622cc8" stroke-width="5" stroke-linecap="round"/>
    <line x1="1036.67" y1="205" x2="1036.67" y2="223" stroke="#622cc8" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="branches" id="couche4">
    <line x1="104" y1="214" x2="104" y2="510" stroke="#b09ce8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="104" cy="302" r="6" fill="#b09ce8"/>
    <circle cx="104" cy="406" r="6" fill="#b09ce8"/>
    <circle cx="104" cy="510" r="6" fill="#b09ce8"/>
    <line x1="577.333" y1="214" x2="577.333" y2="510" stroke="#8c62e0" stroke-width="2" stroke-linecap="round"/>
    <circle cx="577.333" cy="302" r="6" fill="#8c62e0"/>
    <circle cx="577.333" cy="406" r="6" fill="#8c62e0"/>
    <circle cx="577.333" cy="510" r="6" fill="#8c62e0"/>
    <line x1="1050.67" y1="214" x2="1050.67" y2="510" stroke="#622cc8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="1050.67" cy="302" r="6" fill="#622cc8"/>
    <circle cx="1050.67" cy="406" r="6" fill="#622cc8"/>
    <circle cx="1050.67" cy="510" r="6" fill="#622cc8"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="axe" id="couche5">
    <text x="90" y="175" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#622cc8" letter-spacing="1.4" xml:space="preserve">PRÉVOIR</text>
    <text x="90" y="200" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">avant le tournage</text>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="entrées" id="couche6">
    <text x="126" y="309" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1a1b20" xml:space="preserve">Alfred Hitchcock</text>
    <text x="126" y="332" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">« tout a déjà été fait pendant l’élaboration du scénario »</text>
    <text x="126" y="413" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1a1b20" xml:space="preserve">Bong Joon-ho</text>
    <text x="126" y="436" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">« Bong ne tourne pas de couverture », dit son monteur</text>
    <text x="126" y="517" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1a1b20" xml:space="preserve">George Miller</text>
    <text x="126" y="540" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">3 500 vignettes alignées sur un mur, neuf mois durant</text>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="axe" id="couche7">
    <text x="563.333" y="175" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#622cc8" letter-spacing="1.4" xml:space="preserve">PROVOQUER</text>
    <text x="563.333" y="200" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">pendant le tournage</text>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="entrées" id="couche8">
    <text x="599.333" y="309" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1a1b20" xml:space="preserve">Mike Leigh</text>
    <text x="599.333" y="332" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">six mois de répétitions, aucun scénario au départ</text>
    <text x="599.333" y="413" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1a1b20" xml:space="preserve">Maurice Pialat</text>
    <text x="599.333" y="436" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">« improviser, c’est écrire »</text>
    <text x="599.333" y="517" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1a1b20" xml:space="preserve">Abdellatif Kechiche</text>
    <text x="599.333" y="540" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">plus de cent prises pour trente secondes</text>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="axe" id="couche9">
    <text x="1036.67" y="175" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#622cc8" letter-spacing="1.4" xml:space="preserve">RÉCOLTER</text>
    <text x="1036.67" y="200" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">au montage</text>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="entrées" id="couche10">
    <text x="1072.67" y="309" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1a1b20" xml:space="preserve">Stanley Kubrick</text>
    <text x="1072.67" y="332" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">au moins deux prises parfaites par scène</text>
    <text x="1072.67" y="413" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1a1b20" xml:space="preserve">David Fincher</text>
    <text x="1072.67" y="436" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">la caméra comme « récolte de performances »</text>
    <text x="1072.67" y="517" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1a1b20" xml:space="preserve">Ridley Scott</text>
    <text x="1072.67" y="540" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">jusqu’à onze caméras, l’angle se choisit après</text>
  </g>
</svg>
