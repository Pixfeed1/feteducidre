<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1600px" height="710px" viewBox="0 0 1600 710" version="1.1">
  <title>L’OBJ A QUITTÉ LES DÉCORS DE LA BOUTIQUE DAZ</title>
  <desc>part des nouveaux décors vendus au seul format DUF, aux seules années que l’article chiffre : entre elles, rien n’a été mesuré</desc>
  <g inkscape:groupmode="layer" inkscape:label="fond" id="couche1">
    <rect x="0" y="0" width="1600" height="710" rx="0" fill="#faf9f6"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="titre" id="couche2">
    <text x="56" y="64" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1a1b20" letter-spacing="2.2" xml:space="preserve">L’OBJ A QUITTÉ LES DÉCORS DE LA BOUTIQUE DAZ</text>
    <text x="56" y="90" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#8c8d96" xml:space="preserve">part des nouveaux décors vendus au seul format DUF, aux seules années que l’article chiffre : entre elles, rien n’a été mesuré</text>
    <rect x="56" y="108" width="22" height="14" rx="4" fill="#622cc8"/>
    <text x="88" y="119" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#646670" xml:space="preserve">au seul format DUF</text>
    <rect x="249.375" y="108" width="22" height="14" rx="4" fill="#b45309"/>
    <text x="281.375" y="119" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#646670" xml:space="preserve">existait aussi en OBJ</text>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="grille" id="couche3">
    <line x1="66" y1="592" x2="1526" y2="592" stroke="#d5d3cc" stroke-width="1"/>
    <line x1="66" y1="503" x2="1526" y2="503" stroke="#d5d3cc" stroke-width="1"/>
    <line x1="66" y1="414" x2="1526" y2="414" stroke="#d5d3cc" stroke-width="1"/>
    <line x1="66" y1="325" x2="1526" y2="325" stroke="#d5d3cc" stroke-width="1"/>
    <line x1="66" y1="236" x2="1526" y2="236" stroke="#d5d3cc" stroke-width="1"/>
    <text x="58" y="596" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#8c8d96" xml:space="preserve">0 %</text>
    <text x="58" y="507" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#8c8d96" xml:space="preserve">25 %</text>
    <text x="58" y="418" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#8c8d96" xml:space="preserve">50 %</text>
    <text x="58" y="329" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#8c8d96" xml:space="preserve">75 %</text>
    <text x="58" y="240" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#8c8d96" xml:space="preserve">100 %</text>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="seuil" id="couche4">
    <line x1="1074.75" y1="260.92" x2="1526" y2="260.92" stroke="#b45309" stroke-width="2"/>
    <line x1="1074.75" y1="250.92" x2="1074.75" y2="270.92" stroke="#b45309" stroke-width="2"/>
    <text x="1086.75" y="247.92" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#b45309" xml:space="preserve">depuis 2021, jamais sous 93 %</text>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="jalon" id="couche5">
    <line x1="316.5" y1="592" x2="316.5" y2="600" stroke="#8c8d96" stroke-width="2"/>
    <text x="316.5" y="618" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#8c8d96" text-anchor="middle" xml:space="preserve">2012</text>
    <text x="316.5" y="684" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#8c8d96" text-anchor="middle" xml:space="preserve">les premiers décors en DUF seul</text>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="grille" id="couche6">
    <line x1="66" y1="592" x2="1526" y2="592" stroke="#aaaeba" stroke-width="2"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="colonnes" id="couche7">
    <rect x="122" y="257.36" width="52" height="334.64" rx="4" fill="#b45309"/>
    <rect x="206.25" y="589" width="52" height="3" rx="4" fill="#622cc8"/>
    <rect x="627.5" y="378.4" width="52" height="213.6" rx="4" fill="#622cc8"/>
    <rect x="1385.75" y="237.55" width="52" height="354.45" rx="4" fill="#622cc8"/>
    <rect x="1470" y="239.56" width="52" height="352.44" rx="4" fill="#622cc8"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="valeurs" id="couche8">
    <text x="148" y="247.36" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#b45309" text-anchor="middle" xml:space="preserve">94 %</text>
    <text x="232.25" y="579" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#622cc8" text-anchor="middle" xml:space="preserve">0 %</text>
    <text x="653.5" y="368.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#622cc8" text-anchor="middle" xml:space="preserve">60 %</text>
    <text x="1411.75" y="223.55" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#8c8d96" text-anchor="middle" xml:space="preserve">915 sur 919</text>
    <text x="1411.75" y="205.55" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#622cc8" text-anchor="middle" xml:space="preserve">99,6 %</text>
    <text x="1496" y="229.56" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#622cc8" text-anchor="middle" xml:space="preserve">99 %</text>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="années" id="couche9">
    <text x="148" y="620" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1a1b20" text-anchor="middle" xml:space="preserve">2010</text>
    <text x="232.25" y="620" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1a1b20" text-anchor="middle" xml:space="preserve">2011</text>
    <text x="653.5" y="620" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1a1b20" text-anchor="middle" xml:space="preserve">2016</text>
    <text x="1411.75" y="620" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1a1b20" text-anchor="middle" xml:space="preserve">2025</text>
    <text x="1496" y="620" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1a1b20" text-anchor="middle" xml:space="preserve">2026</text>
    <text x="148" y="640" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#b45309" text-anchor="middle" xml:space="preserve">aussi en OBJ</text>
    <text x="232.25" y="662" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#8c8d96" text-anchor="middle" xml:space="preserve">le DUF n’existe pas encore</text>
    <text x="653.5" y="640" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#8c8d96" text-anchor="middle" xml:space="preserve">la bascule</text>
  </g>
</svg>
