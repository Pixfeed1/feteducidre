    <rect x="56" y="420" width="1488" height="108" rx="12" fill="none" stroke="#d5d3cc" stroke-width="2"/>
    <rect x="56" y="542" width="1488" height="108" rx="12" fill="#ffffff"/>
    <rect x="56" y="542" width="1488" height="108" rx="12" fill="none" stroke="#d5d3cc" stroke-width="2"/>
    <rect x="56" y="664" width="1488" height="108" rx="12" fill="#ffffff"/>
    <rect x="56" y="664" width="1488" height="108" rx="12" fill="none" stroke="#d5d3cc" stroke-width="2"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="numéros" id="couche4">
    <circle cx="96" cy="230" r="18" fill="#622cc8"/>
    <text x="91.2734" y="235" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" xml:space="preserve">1</text>
    <circle cx="96" cy="352" r="18" fill="#622cc8"/>
    <text x="91.2734" y="357" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" xml:space="preserve">2</text>
    <circle cx="96" cy="474" r="18" fill="#622cc8"/>
    <text x="91.2734" y="479" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" xml:space="preserve">3</text>
    <circle cx="96" cy="596" r="18" fill="#622cc8"/>
    <text x="91.2734" y="601" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" xml:space="preserve">4</text>
    <circle cx="96" cy="718" r="18" fill="#622cc8"/>
    <text x="91.2734" y="723" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" xml:space="preserve">5</text>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="textes" id="couche5">
    <text x="132" y="218" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#1a1b20" xml:space="preserve">École privée</text>
    <text x="132" y="245" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#8c8d96" xml:space="preserve">Rubika, ArtFX, ESMA, MoPA, Émile Cohl…</text>
    <text x="472" y="219" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#b45309" xml:space="preserve">35 000 à 55 000 €</text>
    <text x="472" y="249" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#8c8d96" xml:space="preserve">7 000 à 11 000 € par an</text>
    <text x="762" y="217" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1a1b20" xml:space="preserve">5 ans</text>
    <text x="762" y="249" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#8c8d96" xml:space="preserve">majoritairement cinq ans</text>
    <text x="1192" y="220" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">Un réseau réel, qui vaut plus cher que le diplôme</text>
    <text x="1192" y="241" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">qu’il accompagne.</text>
    <text x="132" y="340" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#1a1b20" xml:space="preserve">Consulaire et public</text>
    <text x="132" y="367" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#8c8d96" xml:space="preserve">Gobelins et ENSAD, sélection sur concours</text>
    <text x="472" y="339" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#646670" xml:space="preserve">Non chiffré</text>
    <text x="472" y="371" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#8c8d96" xml:space="preserve">« rien à voir avec le privé »</text>
    <text x="762" y="339" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#646670" xml:space="preserve">Non chiffrée</text>
    <text x="762" y="371" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#8c8d96" xml:space="preserve">un an de prépa en amont</text>
    <text x="1192" y="332" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">La même chose que le privé, pour un rapport entre</text>
    <text x="1192" y="353" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">ce qu’on paie et ce qu’on reçoit sans commune</text>
    <text x="1192" y="374" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">mesure.</text>
    <text x="132" y="462" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#1a1b20" xml:space="preserve">Alternance</text>
    <text x="132" y="489" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#8c8d96" xml:space="preserve">plus d’un étudiant sur trois aux Gobelins</text>
    <text x="472" y="463" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#b45309" xml:space="preserve">0 €, et rémunéré</text>
    <text x="472" y="493" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#8c8d96" xml:space="preserve">l’entreprise finance la formation</text>
    <text x="762" y="461" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1a1b20" xml:space="preserve">2 à 3 ans</text>
    <text x="762" y="493" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#8c8d96" xml:space="preserve">de production réelle</text>
    <text x="1192" y="464" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">Deux ou trois ans de production réelle au lieu d’un</text>
    <text x="1192" y="485" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">book d’exercices scolaires.</text>
    <text x="132" y="584" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#1a1b20" xml:space="preserve">Reconversion</text>
    <text x="132" y="611" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#8c8d96" xml:space="preserve">Mon Compte Formation, France Travail, RNCP</text>
    <text x="472" y="583" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#646670" xml:space="preserve">Non chiffré</text>
    <text x="472" y="615" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#8c8d96" xml:space="preserve">CPF ou France Travail</text>
    <text x="762" y="583" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1a1b20" xml:space="preserve">Semaines à mois</text>
    <text x="762" y="615" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#8c8d96" xml:space="preserve">formats courts</text>
    <text x="1192" y="586" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">Un socle technique. L’article écrit : pas le réseau,</text>
    <text x="1192" y="607" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">ni les trois ans de pratique encadrée.</text>
    <text x="132" y="706" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#1a1b20" xml:space="preserve">Autoformation</text>
    <text x="132" y="733" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#8c8d96" xml:space="preserve">Blender, documentation, tutoriels, livres</text>
    <text x="472" y="707" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#b45309" xml:space="preserve">0 €</text>
    <text x="472" y="737" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#8c8d96" xml:space="preserve">logiciel et documentation gratuits</text>
    <text x="762" y="705" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#646670" xml:space="preserve">Non chiffrée</text>
    <text x="762" y="737" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#8c8d96" xml:space="preserve">« quelques années de plus »</text>
    <text x="1192" y="698" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">Rien des trois. Elles se reconstituent hors école,</text>
    <text x="1192" y="719" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">avec une discipline que personne ne vous</text>
    <text x="1192" y="740" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">imposera.</text>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="marques" id="couche6">
    <circle cx="984" cy="218" r="9" fill="#622cc8"/>
    <circle cx="1056" cy="218" r="9" fill="#622cc8"/>
    <circle cx="1128" cy="218" r="9" fill="#622cc8"/>
    <circle cx="984" cy="340" r="9" fill="#622cc8"/>
    <circle cx="1056" cy="340" r="9" fill="#622cc8"/>
    <circle cx="1128" cy="340" r="9" fill="#622cc8"/>
    <circle cx="984" cy="462" r="9" fill="#622cc8"/>
    <circle cx="1056" cy="462" r="9" fill="#622cc8"/>
    <circle cx="1128" cy="462" r="9" fill="#622cc8"/>
    <line x1="976" y1="584" x2="992" y2="584" stroke="#8c8d96" stroke-width="2"/>
    <line x1="1048" y1="584" x2="1064" y2="584" stroke="#8c8d96" stroke-width="2"/>
    <circle cx="1128" cy="584" r="9" fill="#ffffff" stroke="#c4bed6" stroke-width="3"/>
    <circle cx="984" cy="706" r="9" fill="#ffffff" stroke="#c4bed6" stroke-width="3"/>
    <circle cx="1056" cy="706" r="9" fill="#ffffff" stroke="#c4bed6" stroke-width="3"/>
    <circle cx="1128" cy="706" r="9" fill="#ffffff" stroke="#c4bed6" stroke-width="3"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="pied" id="couche7">
    <line x1="56" y1="804" x2="1544" y2="804" stroke="#d5d3cc" stroke-width="2"/>
    <circle cx="65" cy="836" r="9" fill="#622cc8"/>
    <text x="82" y="839" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#646670" xml:space="preserve">l’article l’affirme</text>
    <circle cx="233.203" cy="836" r="9" fill="#ffffff" stroke="#c4bed6" stroke-width="3"/>
    <text x="250.203" y="839" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#646670" xml:space="preserve">l’article dit le contraire</text>
    <line x1="432.589" y1="836" x2="448.589" y2="836" stroke="#8c8d96" stroke-width="2"/>
    <text x="457.589" y="839" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#646670" xml:space="preserve">l’article ne se prononce pas</text>
    <text x="56" y="877" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#8c8d96" xml:space="preserve">Les trois premières voies portent les mêmes trois marques, et c’est le résultat de la figure, pas sa faiblesse : ce qui les sépare n’est pas ce qu’on y gagne, c’est la facture.</text>
    <text x="56" y="907" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#8c8d96" xml:space="preserve">Deux des cinq voies n’ont pas de coût chiffré dans l’article et deux n’ont pas de durée. Elles portent « non chiffré » plutôt qu’un nombre vraisemblable, qui serait indiscernable d’un nombre relevé.</text>
    <text x="56" y="937" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#8c8d96" xml:space="preserve">Le regard, le rythme et le carnet d’adresses sont, mot pour mot, « les trois choses qu’une école vend vraiment ». Les marques ne disent que ce que le texte affirme ou nie.</text>
  </g>
</svg>
