<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1600px" height="974px" viewBox="0 0 1600 974" version="1.1">
  <title>LE MÊME MÉTIER, DE ZÉRO À 55 000 EUROS</title>
  <desc>cinq voies vers la 3D, ce qu’elles coûtent, ce qu’elles durent, et ce qu’elles donnent en plus de la technique</desc>
  <g inkscape:groupmode="layer" inkscape:label="fond" id="couche1">
    <rect x="0" y="0" width="1600" height="974" rx="0" fill="#faf9f6"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="titre" id="couche2">
    <text x="56" y="64" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1a1b20" letter-spacing="2.2" xml:space="preserve">LE MÊME MÉTIER, DE ZÉRO À 55 000 EUROS</text>
    <text x="56" y="90" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#8c8d96" xml:space="preserve">cinq voies vers la 3D, ce qu’elles coûtent, ce qu’elles durent, et ce qu’elles donnent en plus de la technique</text>
    <line x1="56" y1="128" x2="1544" y2="128" stroke="#d5d3cc" stroke-width="2"/>
    <text x="132" y="162" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#646670" xml:space="preserve">la voie</text>
    <text x="472" y="162" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#646670" xml:space="preserve">ce qu’elle coûte</text>
    <text x="762" y="162" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#646670" xml:space="preserve">combien de temps</text>
    <text x="1192" y="162" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#646670" xml:space="preserve">en plus de la technique</text>
    <text x="956.547" y="162" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#646670" xml:space="preserve">le regard</text>
    <text x="1027.1" y="162" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#646670" xml:space="preserve">le rythme</text>
    <text x="1099.82" y="162" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#646670" xml:space="preserve">le réseau</text>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="cartes" id="couche3">
    <rect x="56" y="176" width="1488" height="108" rx="12" fill="#ffffff"/>
    <rect x="56" y="176" width="1488" height="108" rx="12" fill="none" stroke="#d5d3cc" stroke-width="2"/>
    <rect x="56" y="298" width="1488" height="108" rx="12" fill="#ffffff"/>
