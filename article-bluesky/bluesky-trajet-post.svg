<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1600px" height="609px" viewBox="0 0 1600 609" version="1.1">
  <title>LE TRAJET D’UN POST, ET QUI TIENT CHAQUE ÉTAGE</title>
  <desc>du serveur qui héberge votre compte jusqu’à l’appli qui l’affiche, chacun des quatre étages peut changer de mains</desc>
  <g inkscape:groupmode="layer" inkscape:label="fond" id="couche1">
    <rect x="0" y="0" width="1600" height="609" rx="0" fill="#faf9f6"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="titre" id="couche2">
    <text x="56" y="64" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1a1b20" letter-spacing="2.2" xml:space="preserve">LE TRAJET D’UN POST, ET QUI TIENT CHAQUE ÉTAGE</text>
    <text x="56" y="90" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#8c8d96" xml:space="preserve">du serveur qui héberge votre compte jusqu’à l’appli qui l’affiche, chacun des quatre étages peut changer de mains</text>
    <circle cx="63" cy="128" r="7" fill="#622cc8"/>
    <text x="78" y="132" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#646670" xml:space="preserve">tenu par l’entreprise Bluesky</text>
    <circle cx="301.651" cy="128" r="7" fill="#b45309"/>
    <text x="316.651" y="132" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#646670" xml:space="preserve">tenu par des indépendants</text>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="rail" id="couche3">
    <line x1="275" y1="332" x2="1325" y2="332" stroke="#d5d3cc" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="étages" id="couche4">
    <text x="275" y="206" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#1a1b20" text-anchor="middle" xml:space="preserve">Le PDS</text>
    <text x="275" y="251" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" text-anchor="middle" xml:space="preserve">le serveur de données personnelles, qui</text>
    <text x="275" y="272" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" text-anchor="middle" xml:space="preserve">héberge votre compte et vos posts</text>
    <text x="625" y="206" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#1a1b20" text-anchor="middle" xml:space="preserve">Le relais</text>
    <text x="625" y="251" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" text-anchor="middle" xml:space="preserve">il rassemble le flux de tous les serveurs du</text>
    <text x="625" y="272" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" text-anchor="middle" xml:space="preserve">réseau</text>
    <text x="975" y="206" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#1a1b20" text-anchor="middle" xml:space="preserve">L’AppView</text>
    <text x="975" y="251" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" text-anchor="middle" xml:space="preserve">elle trie le flux, compte les likes et fabrique</text>
    <text x="975" y="272" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" text-anchor="middle" xml:space="preserve">les fils</text>
    <text x="1325" y="206" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#1a1b20" text-anchor="middle" xml:space="preserve">L’appli</text>
    <text x="1325" y="272" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" text-anchor="middle" xml:space="preserve">elle affiche ce que l’AppView a préparé</text>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="pastilles" id="couche5">
    <circle cx="275" cy="332" r="21" fill="#faf9f6"/>
    <circle cx="275" cy="332" r="18" fill="#622cc8"/>
    <text x="275" y="337" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle" xml:space="preserve">1</text>
    <circle cx="625" cy="332" r="21" fill="#faf9f6"/>
    <circle cx="625" cy="332" r="18" fill="#622cc8"/>
    <text x="625" y="337" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle" xml:space="preserve">2</text>
    <circle cx="975" cy="332" r="21" fill="#faf9f6"/>
    <circle cx="975" cy="332" r="18" fill="#622cc8"/>
    <text x="975" y="337" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle" xml:space="preserve">3</text>
    <circle cx="1325" cy="332" r="21" fill="#faf9f6"/>
    <circle cx="1325" cy="332" r="18" fill="#622cc8"/>
    <text x="1325" y="337" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle" xml:space="preserve">4</text>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="opérateurs" id="couche6">
    <text x="275" y="407" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#622cc8" text-anchor="middle" xml:space="preserve">bsky.social, le serveur par défaut</text>
    <text x="275" y="446" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#b45309" text-anchor="middle" xml:space="preserve">3 788 serveurs, 121 470 comptes, soit</text>
    <text x="275" y="469" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#b45309" text-anchor="middle" xml:space="preserve">0,26 % du réseau</text>
    <text x="625" y="407" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#622cc8" text-anchor="middle" xml:space="preserve">le relais de l’entreprise</text>
    <text x="625" y="446" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#b45309" text-anchor="middle" xml:space="preserve">Blacksky, Eurosky. Deux cœurs et 12 Go</text>
    <text x="625" y="469" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#b45309" text-anchor="middle" xml:space="preserve">suffisent depuis mai 2025</text>
    <text x="975" y="407" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#622cc8" text-anchor="middle" xml:space="preserve">l’AppView de l’entreprise</text>
    <text x="975" y="446" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#b45309" text-anchor="middle" xml:space="preserve">Blacksky a la sienne depuis début 2026</text>
    <text x="1325" y="407" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#622cc8" text-anchor="middle" xml:space="preserve">l’appli Bluesky</text>
    <text x="1325" y="446" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#b45309" text-anchor="middle" xml:space="preserve">près de 200 applis bâties en quatre mois</text>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="annuaire" id="couche7">
    <line x1="56" y1="507" x2="1544" y2="507" stroke="#d5d3cc" stroke-width="2" stroke-linecap="round"/>
    <circle cx="63" cy="540" r="7" fill="#8c8d96"/>
    <text x="80" y="547" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1a1b20" xml:space="preserve">L’annuaire des identités</text>
    <text x="80" y="571" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">Il relie chaque compte à son serveur, et ne dépend d’aucun des quatre étages. Bluesky a annoncé en septembre 2025 le confier à une association de droit suisse.</text>
  </g>
</svg>
