    <text x="1170.79" y="167" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#622cc8" xml:space="preserve">5.2, en 2020</text>
    <text x="1170.79" y="190" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">les bases de LE Audio</text>
