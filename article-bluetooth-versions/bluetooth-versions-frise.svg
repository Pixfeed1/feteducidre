    <text x="257.68" y="274" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">l’appairage simplifié, sans code à taper</text>
    <text x="693.055" y="167" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#622cc8" xml:space="preserve">4.0, en 2010</text>
    <text x="693.055" y="190" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">le Low Energy, et avec lui les objets</text>
    <text x="693.055" y="211" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#646670" xml:space="preserve">connectés</text>
